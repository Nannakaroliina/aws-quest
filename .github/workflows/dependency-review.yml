name: Dependency review

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/**

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ["*"]
    ignore:
      # TS 7 is unsupported by @sveltejs/kit, svelte-check and typescript-eslint
      # (peer ranges cap at TS 6). Remove once they support it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
